<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="astralBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08111a"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b0033"/>
    </linearGradient>
    <radialGradient id="nebulaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ec8e3" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#1b0033" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0d1b2a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#astralBg)"/>
  <circle cx="960" cy="540" r="500" fill="url(#nebulaGlow)"/>

  <!-- Orbital Coordinate Rings -->
  <circle cx="960" cy="540" r="450" fill="none" stroke="#7ec8e3" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="2,10"/>
  <circle cx="960" cy="540" r="320" fill="none" stroke="#7ec8e3" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="960" cy="540" r="180" fill="none" stroke="#7ec8e3" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8,4"/>

  <!-- Celestial Grid Lines -->
  <line x1="200" y1="540" x2="1720" y2="540" stroke="#7ec8e3" stroke-width="0.8" stroke-opacity="0.15"/>
  <line x1="960" y1="100" x2="960" y2="980" stroke="#7ec8e3" stroke-width="0.8" stroke-opacity="0.15"/>

  <!-- Minimal Corner Border -->
  <rect x="50" y="50" width="1820" height="980" fill="none" stroke="#7ec8e3" stroke-width="1" stroke-opacity="0.25"/>
  
  <text x="960" y="548" font-family="Lato, sans-serif" font-size="26" font-weight="bold" fill="#7ec8e3" fill-opacity="0.3" text-anchor="middle" letter-spacing="10">
    ARS ARCANUM // ASTRAL
  </text>
</svg>
