# /etc/sysctl.d/99-ars-security.conf — Ars Arcanum Kernel Hardening Profile

# Restrict Kernel Pointer Exposure
kernel.kptr_restrict = 2

# Restrict dmesg Access to Root Only
kernel.dmesg_restrict = 1

# Disable Unprivileged eBPF
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# Restrict ptrace Scopes to Parent Processes Only
# NOTE: ptrace_scope=2 breaks debuggers; intentional for hardened writer appliance.
kernel.yama.ptrace_scope = 2

# Unprivileged User Namespaces: REQUIRED by Flatpak (Obsidian/Blanket/draw.io).
# The Debian-specific key kernel.unprivileged_userns_clone does not exist on
# upstream kernels (logs "unknown key") and setting it to 0 breaks all Flatpaks.
# Keep user namespaces ENABLED; Flatpak sandboxing + AppArmor provide confinement.
# To harden instead: rely on AppArmor + flatpak override --nosocket=network.
# kernel.unprivileged_userns_clone = 0

# Network Hardening: Reject ICMP Redirects (Prevent MITM)
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# Protect Hardlinks and Symlinks against TOCTOU Race Conditions
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# Enable TCP SYN Cookies against SYN flood attacks
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
