# /etc/usbguard/rules.conf — Ars Arcanum USBGuard Policy
# Only allow pre-authorized Human Interface Devices (keyboards, mice) and authenticated mass storage

# Allow root hub devices
allow with-interface equals { 09:00:* }

# Allow keyboards, mice, and pointing devices
allow with-interface equals { 03:01:01 }
allow with-interface equals { 03:01:02 }
allow with-interface equals { 03:00:01 }
allow with-interface equals { 03:00:02 }

# Allow digital graphics drawing tablets (HID class)
allow with-interface equals { 03:00:00 }

# Block all unknown device types by default (unauthorized USB network cards, rubber duckies, badUSBs)
block
